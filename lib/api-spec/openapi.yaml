components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OkResponse:
      type: object
      properties:
        success: { type: boolean }
      required: [success]

    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 4 }
      required: [email, password]
    RegisterInput:
      type: object
      properties:
        condominiumName: { type: string, minLength: 2 }
        adminName: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
      required: [condominiumName, adminName, email, password]
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
        condominium: { $ref: "#/components/schemas/Condominium" }
      required: [token, user, condominium]
    MeResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        condominium: { $ref: "#/components/schemas/Condominium" }
        permissions:
          type: array
          items: { type: string }
      required: [user, condominium, permissions]

    Condominium:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        cnpj: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        primaryColor: { type: string, nullable: true }
        finePercent: { type: number }
        interestPercent: { type: number }
        modules:
          type: array
          items: { type: string }
        createdAt: { type: string }
      required: [id, name, finePercent, interestPercent, modules, createdAt]
    UpdateCondominiumInput:
      type: object
      properties:
        name: { type: string }
        address: { type: string, nullable: true }
        cnpj: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        primaryColor: { type: string, nullable: true }
        finePercent: { type: number }
        interestPercent: { type: number }
        modules:
          type: array
          items: { type: string }

    User:
      type: object
      properties:
        id: { type: string }
        condominiumId: { type: string }
        email: { type: string }
        name: { type: string }
        roleId: { type: string, nullable: true }
        roleName: { type: string, nullable: true }
        active: { type: boolean }
        createdAt: { type: string }
      required: [id, condominiumId, email, name, active, createdAt]
    CreateUserInput:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 2 }
        password: { type: string, minLength: 6 }
        roleId: { type: string, nullable: true }
        active: { type: boolean }
      required: [email, name, password]
    UpdateUserInput:
      type: object
      properties:
        name: { type: string }
        roleId: { type: string, nullable: true }
        active: { type: boolean }
        password: { type: string, nullable: true }

    Role:
      type: object
      properties:
        id: { type: string }
        condominiumId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        permissions:
          type: array
          items: { type: string }
        createdAt: { type: string }
      required: [id, condominiumId, name, permissions, createdAt]
    CreateRoleInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        permissions:
          type: array
          items: { type: string }
      required: [name, permissions]

    DashboardSummary:
      type: object
      properties:
        totalUnits: { type: integer }
        totalResidents: { type: integer }
        totalIncomeMonth: { type: number }
        totalExpenseMonth: { type: number }
        balance: { type: number }
        delinquencyRate: { type: number }
        delinquentCount: { type: integer }
        openIssues: { type: integer }
        upcomingReservations: { type: integer }
        pendingDeliveries: { type: integer }
        forecastNextMonth: { type: number }
        healthScore: { type: integer }
      required: [totalUnits, totalResidents, totalIncomeMonth, totalExpenseMonth, balance, delinquencyRate, delinquentCount, openIssues, upcomingReservations, pendingDeliveries, forecastNextMonth, healthScore]
    CashflowPoint:
      type: object
      properties:
        month: { type: string }
        income: { type: number }
        expense: { type: number }
        balance: { type: number }
      required: [month, income, expense, balance]
    DelinquencyEntry:
      type: object
      properties:
        unitId: { type: string }
        unitLabel: { type: string }
        residentName: { type: string, nullable: true }
        overdueAmount: { type: number }
        overdueCount: { type: integer }
      required: [unitId, unitLabel, overdueAmount, overdueCount]
    AlertItem:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [charge, contract, delinquency] }
        title: { type: string }
        description: { type: string }
        date: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
      required: [id, kind, title, description, date, severity]
    GlobalSearchResult:
      type: object
      properties:
        residents:
          type: array
          items: { $ref: "#/components/schemas/Resident" }
        units:
          type: array
          items: { $ref: "#/components/schemas/Unit" }
        charges:
          type: array
          items: { $ref: "#/components/schemas/Charge" }
      required: [residents, units, charges]

    Unit:
      type: object
      properties:
        id: { type: string }
        condominiumId: { type: string }
        block: { type: string, nullable: true }
        number: { type: string }
        floor: { type: string, nullable: true }
        type: { type: string, nullable: true }
        sizeM2: { type: number, nullable: true }
        parkingSpots: { type: integer }
        ownerName: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string }
      required: [id, condominiumId, number, parkingSpots, createdAt]
    CreateUnitInput:
      type: object
      properties:
        block: { type: string, nullable: true }
        number: { type: string }
        floor: { type: string, nullable: true }
        type: { type: string, nullable: true }
        sizeM2: { type: number, nullable: true }
        parkingSpots: { type: integer }
        ownerName: { type: string, nullable: true }
        notes: { type: string, nullable: true }
      required: [number, parkingSpots]

    Resident:
      type: object
      properties:
        id: { type: string }
        condominiumId: { type: string }
        unitId: { type: string, nullable: true }
        unitLabel: { type: string, nullable: true }
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        document: { type: string, nullable: true }
        kind: { type: string, enum: [owner, tenant, dependent] }
        moveInDate: { type: string, nullable: true }
        active: { type: boolean }
        createdAt: { type: string }
      required: [id, condominiumId, name, kind, active, createdAt]
    CreateResidentInput:
      type: object
      properties:
        unitId: { type: string, nullable: true }
        name: { type: string, minLength: 2 }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        document: { type: string, nullable: true }
        kind: { type: string, enum: [owner, tenant, dependent] }
        moveInDate: { type: string, nullable: true }
        active: { type: boolean }
      required: [name, kind]

    Charge:
      type: object
      properties:
        id: { type: string }
        condominiumId: { type: string }
        unitId: { type: string, nullable: true }
        unitLabel: { type: string, nullable: true }
        type: { type: string, enum: [income, expense, fine] }
        category: { type: string }
        description: { type: string }
        amount: { type: number }
        dueDate: { type: string }
        status: { type: string, enum: [pending, paid, overdue, cancelled] }
        paidAt: { type: string, nullable: true }
        createdAt: { type: string }
