openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CondoOS — Multi-tenant condominium management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: condominiums
  - name: users
  - name: roles
  - name: dashboard
  - name: residents
  - name: units
  - name: charges
  - name: payments
  - name: notices
  - name: issues
  - name: deliveries
  - name: vehicles
  - name: reservations
  - name: documents
  - name: services
  - name: suppliers
  - name: contracts
  - name: events
  - name: logs
  - name: marketplace
  - name: marketplace

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ---------------- AUTH ----------------
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new condominium with its first admin user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }

  # ---------------- CONDOMINIUMS ----------------
  /condominiums/current:
    get:
      operationId: getCurrentCondominium
      tags: [condominiums]
