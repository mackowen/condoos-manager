        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCondominiumInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Condominium" }

  # ---------------- USERS ----------------
  /users:
    get:
      operationId: listUsers
      tags: [users]
      parameters:
        - { in: query, name: search, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
